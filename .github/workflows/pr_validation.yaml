name: PR Version Validation (Prod, Master)
on:
  pull_request:

jobs:
  validate:
    uses: mkaraki/mkarakiapps-releasing-actions/.github/workflows/pr-version-validator.yaml@v0.1.2
    with:
      target-branch: ${{ github.base_ref }}
      version-file: version.go
      version-file-format: php
